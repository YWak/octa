<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ファイティングコマンダーボタン割り当て</title>
    <style>
      :root {
        --bg: #f4f1e8;
        --paper: #fffdf8;
        --ink: #1d2433;
        --muted: #6b7280;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        color: var(--ink);
        font-family: "Noto Sans JP", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
        background:
          radial-gradient(1000px 600px at 90% -10%, #ffe2bf 0%, transparent 65%),
          radial-gradient(900px 500px at -10% 110%, #d8ecff 0%, transparent 60%),
          var(--bg);
      }

      .wrap {
        max-width: 1100px;
        margin: 24px auto;
        padding: 0 16px;
      }

      .card {
        background: var(--paper);
        border: 2px solid #e7e2d7;
        border-radius: 16px;
        box-shadow: 0 12px 24px rgba(29, 36, 51, 0.08);
      }

      .header {
        padding: 20px 22px 8px;
      }

      .header h1 {
        margin: 0;
        font-size: clamp(1.3rem, 2.4vw, 1.9rem);
        letter-spacing: 0.02em;
      }

      .header p {
        margin: 10px 0 0;
        color: var(--muted);
      }

      .canvas-area {
        margin: 8px 16px 0;
        border: 1px solid #ebe5d8;
        border-radius: 12px;
        padding: 10px;
        background: #fff;
      }

      svg {
        width: 100%;
        height: auto;
        display: block;
      }

      /* ワイヤーフレーム内の割り当て入力欄 (foreignObject の中身) */
      .slot {
        display: flex;
        align-items: center;
        width: 100%;
        height: 100%;
        border: 1px solid #c9bfae;
        border-radius: 6px;
        background: #fff;
        overflow: hidden;
      }

      .slot:focus-within {
        outline: 2px solid #ffd09d;
        border-color: #d09552;
      }

      .slot span {
        flex: 0 0 30px;
        height: 100%;
        display: grid;
        place-items: center;
        font-size: 13px;
        font-weight: 700;
        color: #5a4a35;
        background: #f3ede1;
        border-right: 1px solid #e2d9c8;
      }

      .slot input {
        flex: 1;
        min-width: 0;
        height: 100%;
        border: 0;
        padding: 0 8px;
        font: 700 15px "Noto Sans JP", sans-serif;
        color: #1f2937;
        background: transparent;
        outline: none;
      }

      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: flex-end;
        padding: 14px 16px 16px;
      }

      .field {
        flex: 1;
        min-width: 200px;
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-size: 0.8rem;
        font-weight: 700;
        color: #5a4a35;
      }

      .field input {
        border: 1px solid #d2c9b8;
        border-radius: 8px;
        padding: 8px 10px;
      }

      button {
        border: 0;
        border-radius: 10px;
        background: linear-gradient(150deg, #f58a3a, #d95f02);
        color: #fff;
        padding: 10px 14px;
        font-weight: 700;
        cursor: pointer;
      }

      button:hover {
        filter: brightness(1.05);
      }

      .status {
        width: 100%;
        font-size: 0.82rem;
        color: #5a4a35;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <section class="card">
        <div class="header">
          <h1>ファイティングコマンダーボタン割り当て</h1>
          <p>図の各ボタンから伸びる入力欄に、割り当てを直接書き込んでください。</p>
        </div>

        <div class="canvas-area">
          <svg id="wireframe" viewBox="0 0 1000 700" role="img" aria-label="Fighting Commander OCTA 上面図と前面図"></svg>
        </div>

        <div class="toolbar">
          <label class="field">
            画像のタイトル
            <input id="imageTitle" type="text" value="ファイティングコマンダーボタン割り当て" />
          </label>
          <label class="field">
            ファイル名
            <input id="fileName" type="text" value="octa.png" />
          </label>
          <button id="download">画像化してPNGをダウンロード</button>
          <div class="status" id="status">準備完了</div>
        </div>
      </section>
    </div>

    <script>
      const VIEW_WIDTH = 1000;
      const VIEW_HEIGHT = 700;
      const FRONT_OFFSET_Y = 260;
      const SLOT_WIDTH = 144;
      const SLOT_HEIGHT = 30;
      const SLOT_X = { left: 10, right: VIEW_WIDTH - 10 - SLOT_WIDTH };
      const STORAGE_KEY = "octa-wireframe-assignments";

      const BODY_FILL = "#f7f3e8";
      const BODY_STROKE = "#3b4252";
      const PART_FILL = "#ece6d7";
      const PART_STROKE = "#7c6f5a";

      // leader は、ボタンの縁から入力欄の手前までの折れ線の経由点。入力欄の縁の点は自動で足す。
      const BUTTONS = [
        { id: "r3", view: "top", label: "R3", shape: "rect", x: 300, y: 112, w: 110, h: 28, side: "left", slotY: 112, leader: [[245, 112]] },
        { id: "l3", view: "top", label: "L3", shape: "rect", x: 300, y: 160, w: 110, h: 32, side: "left", slotY: 160, leader: [[245, 160]] },
        { id: "l2", view: "top", label: "L2", shape: "rect", x: 700, y: 112, w: 110, h: 28, side: "right", slotY: 112, leader: [[755, 112]] },
        { id: "l1", view: "top", label: "L1", shape: "rect", x: 700, y: 160, w: 110, h: 32, side: "right", slotY: 160, leader: [[755, 160]] },
        { id: "x", view: "front", label: "□", shape: "circle", x: 608, y: 196, r: 24, side: "right", slotY: 22, leader: [[608, 172], [608, 22]] },
        { id: "y", view: "front", label: "△", shape: "circle", x: 648, y: 156, r: 24, side: "right", slotY: 76, leader: [[648, 132], [648, 76]] },
        { id: "r1", view: "front", label: "R1", shape: "circle", x: 712, y: 136, r: 24, side: "right", slotY: 136, leader: [[736, 136]] },
        { id: "r2", view: "front", label: "R2", shape: "circle", x: 752, y: 176, r: 24, side: "right", slotY: 176, leader: [[776, 176]] },
        { id: "b", view: "front", label: "○", shape: "circle", x: 688, y: 196, r: 24, side: "right", slotY: 238, leader: [[688, 220], [688, 238]] },
        { id: "a", view: "front", label: "✕", shape: "circle", x: 648, y: 236, r: 24, side: "right", slotY: 300, leader: [[648, 260], [648, 300]] }
      ];

      const svgNs = "http://www.w3.org/2000/svg";
      const xhtmlNs = "http://www.w3.org/1999/xhtml";
      const wireframe = document.getElementById("wireframe");
      const statusEl = document.getElementById("status");
      const inputById = {};

      function makeSvg(tag, attrs = {}, text) {
        const node = document.createElementNS(svgNs, tag);
        Object.entries(attrs).forEach(([key, value]) => {
          node.setAttribute(key, String(value));
        });
        if (text !== undefined) node.textContent = text;
        return node;
      }

      function caption(parent, x, y, text, size = 10, anchor = "middle") {
        parent.appendChild(
          makeSvg("text", { x, y, "text-anchor": anchor, "font-size": size, "font-weight": 700, fill: "#8a7c66", "letter-spacing": 0.5 }, text)
        );
      }

      function loadSavedValues() {
        try {
          return JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
        } catch {
          return {};
        }
      }

      function saveValues() {
        try {
          const values = Object.fromEntries(BUTTONS.map((btn) => [btn.id, inputById[btn.id].value]));
          localStorage.setItem(STORAGE_KEY, JSON.stringify(values));
        } catch {
          // 保存できない環境では入力内容をページ内だけで保持する
        }
      }

      // 上面図: 手前(下側)が前面、奥(上側)が背面。
      function drawTopBody(g) {
        // 背面中央から出るケーブル
        g.appendChild(makeSvg("path", { d: "M500 64 C500 40 520 30 540 22", fill: "none", stroke: BODY_STROKE, "stroke-width": 4, "stroke-linecap": "round" }));
        g.appendChild(makeSvg("rect", { x: 488, y: 60, width: 24, height: 44, rx: 5, fill: PART_FILL, stroke: PART_STROKE, "stroke-width": 2 }));

        g.appendChild(
          makeSvg("path", {
            d:
              "M250 200 L750 200 C792 200 812 184 812 158 L812 118 C812 94 792 80 762 80 " +
              "L612 80 C572 80 552 100 500 100 C448 100 428 80 388 80 " +
              "L238 80 C208 80 188 94 188 118 L188 158 C188 184 208 200 250 200 Z",
            fill: BODY_FILL,
            stroke: BODY_STROKE,
            "stroke-width": 3
          })
        );
        // 前面パネルの縁
        g.appendChild(makeSvg("path", { d: "M236 188 L764 188", stroke: "#b8ad98", "stroke-width": 1.5, "stroke-dasharray": "6 5" }));
        caption(g, 500, 222, "FRONT (前面側)", 10);
        caption(g, 500, 124, "BACK", 9);
      }

      // 前面図: 短めのグリップを持つ OCTA の輪郭。
      function drawFrontBody(g) {
        // 上端から見える肩ボタン
        g.appendChild(makeSvg("rect", { x: 242, y: 36, width: 116, height: 26, rx: 10, fill: PART_FILL, stroke: PART_STROKE, "stroke-width": 2 }));
        g.appendChild(makeSvg("rect", { x: 642, y: 36, width: 116, height: 26, rx: 10, fill: PART_FILL, stroke: PART_STROKE, "stroke-width": 2 }));
        // 上端中央から出るケーブル
        g.appendChild(makeSvg("path", { d: "M500 44 C500 24 516 12 536 6", fill: "none", stroke: BODY_STROKE, "stroke-width": 4, "stroke-linecap": "round" }));
        g.appendChild(makeSvg("rect", { x: 488, y: 34, width: 24, height: 16, rx: 4, fill: PART_FILL, stroke: PART_STROKE, "stroke-width": 2 }));

        g.appendChild(
          makeSvg("path", {
            d:
              "M300 50 C420 40 580 40 700 50 C770 56 800 90 808 150 C818 225 828 300 814 356 " +
              "C802 398 748 414 710 392 C676 372 644 330 600 322 L400 322 " +
              "C356 330 324 372 290 392 C252 414 198 398 186 356 C172 300 182 225 192 150 " +
              "C200 90 230 56 300 50 Z",
            fill: BODY_FILL,
            stroke: BODY_STROKE,
            "stroke-width": 3
          })
        );

        drawDpad(g, 330, 190);
      }

      // デフォルメした丸みのある十字キー
      function drawDpad(g, cx, cy) {
        const arm = 54;
        const half = 22;
        const bars = [
          { x: cx - half, y: cy - arm, width: half * 2, height: arm * 2 },
          { x: cx - arm, y: cy - half, width: arm * 2, height: half * 2 }
        ];
        // 輪郭を描いてから塗りだけを重ね、交差部分の内側の線を消す
        bars.forEach((bar) => g.appendChild(makeSvg("rect", { ...bar, rx: 12, fill: "#fff", stroke: "#374151", "stroke-width": 4 })));
        bars.forEach((bar) => g.appendChild(makeSvg("rect", { ...bar, rx: 12, fill: "#fff" })));

        const arrows = [
          [0, -1],
          [0, 1],
          [-1, 0],
          [1, 0]
        ];
        arrows.forEach(([dx, dy]) => {
          const tipX = cx + dx * 44;
          const tipY = cy + dy * 44;
          const baseX = cx + dx * 28;
          const baseY = cy + dy * 28;
          const points = [
            [tipX, tipY],
            [baseX + dy * 10, baseY + dx * 10],
            [baseX - dy * 10, baseY - dx * 10]
          ];
          g.appendChild(makeSvg("polygon", { points: points.map((p) => p.join(",")).join(" "), fill: "#9ca3af", stroke: "#9ca3af", "stroke-width": 4, "stroke-linejoin": "round" }));
        });
      }

      function drawButton(g, btn) {
        if (btn.shape === "circle") {
          g.appendChild(makeSvg("circle", { cx: btn.x, cy: btn.y, r: btn.r, fill: "#fff", stroke: "#374151", "stroke-width": 2 }));
        } else {
          g.appendChild(
            makeSvg("rect", {
              x: btn.x - btn.w / 2,
              y: btn.y - btn.h / 2,
              width: btn.w,
              height: btn.h,
              rx: 8,
              fill: "#fff",
              stroke: "#374151",
              "stroke-width": 2
            })
          );
        }
        g.appendChild(
          makeSvg("text", { x: btn.x, y: btn.y + 5, "text-anchor": "middle", "font-size": 14, "font-weight": 700, fill: "#1f2937" }, btn.label)
        );
      }

      function drawLeader(g, btn) {
        const edgeX = btn.side === "right" ? SLOT_X.right : SLOT_X.left + SLOT_WIDTH;
        const points = [...btn.leader, [edgeX, btn.slotY]];
        const [startX, startY] = points[0];
        g.appendChild(
          makeSvg("polyline", {
            points: points.map((p) => p.join(",")).join(" "),
            fill: "none",
            stroke: "#9ca3af",
            "stroke-width": 1.5,
            "stroke-linejoin": "round"
          })
        );
        g.appendChild(makeSvg("circle", { cx: startX, cy: startY, r: 3, fill: "#9ca3af" }));
      }

      function drawSlot(g, btn, savedValue) {
        const fo = makeSvg("foreignObject", {
          x: btn.side === "right" ? SLOT_X.right : SLOT_X.left,
          y: btn.slotY - SLOT_HEIGHT / 2,
          width: SLOT_WIDTH,
          height: SLOT_HEIGHT
        });
        fo.dataset.buttonId = btn.id;

        const slot = document.createElementNS(xhtmlNs, "label");
        slot.className = "slot";

        const tag = document.createElementNS(xhtmlNs, "span");
        tag.textContent = btn.label;

        const input = document.createElementNS(xhtmlNs, "input");
        input.type = "text";
        input.maxLength = 32;
        input.value = savedValue ?? "";
        input.placeholder = "未設定";
        input.setAttribute("aria-label", btn.label + " の割り当て");
        input.addEventListener("input", saveValues);

        slot.append(tag, input);
        fo.appendChild(slot);
        g.appendChild(fo);
        inputById[btn.id] = input;
      }

      function renderWireframe() {
        const saved = loadSavedValues();
        wireframe.innerHTML = "";

        const views = {
          top: makeSvg("g", { "data-view": "top" }),
          front: makeSvg("g", { "data-view": "front", transform: `translate(0 ${FRONT_OFFSET_Y})` })
        };
        wireframe.appendChild(makeSvg("line", { x1: 0, y1: FRONT_OFFSET_Y - 16, x2: VIEW_WIDTH, y2: FRONT_OFFSET_Y - 16, stroke: "#e2dacb", "stroke-dasharray": "4 6" }));
        caption(wireframe, 16, 28, "上面", 18, "start");
        caption(wireframe, 16, FRONT_OFFSET_Y + 28, "前面", 18, "start");
        Object.values(views).forEach((g) => wireframe.appendChild(g));

        drawTopBody(views.top);
        drawFrontBody(views.front);

        BUTTONS.forEach((btn) => drawLeader(views[btn.view], btn));
        BUTTONS.forEach((btn) => drawButton(views[btn.view], btn));
        BUTTONS.forEach((btn) => drawSlot(views[btn.view], btn, saved[btn.id]));
      }

      // 入力欄 (foreignObject) を SVG の図形に置き換えた、画像化用の SVG 文字列を作る
      function buildExportSvg() {
        const clone = wireframe.cloneNode(true);
        clone.setAttribute("xmlns", svgNs);
        clone.setAttribute("width", VIEW_WIDTH);
        clone.setAttribute("height", VIEW_HEIGHT);
        clone.setAttribute("font-family", "'Noto Sans JP', 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif");

        clone.querySelectorAll("foreignObject").forEach((fo) => {
          const btn = BUTTONS.find((b) => b.id === fo.dataset.buttonId);
          const x = Number(fo.getAttribute("x"));
          const y = Number(fo.getAttribute("y"));
          const value = inputById[btn.id].value.trim();
          const text = value || "未設定";

          const g = makeSvg("g");
          g.appendChild(makeSvg("rect", { x, y, width: SLOT_WIDTH, height: SLOT_HEIGHT, rx: 6, fill: "#fff", stroke: "#c9bfae" }));
          g.appendChild(makeSvg("rect", { x: x + 1, y: y + 1, width: 29, height: SLOT_HEIGHT - 2, rx: 5, fill: "#f3ede1" }));
          g.appendChild(
            makeSvg("text", { x: x + 15, y: y + 20, "text-anchor": "middle", "font-size": 13, "font-weight": 700, fill: "#5a4a35" }, btn.label)
          );

          const maxWidth = SLOT_WIDTH - 30 - 14;
          const estimated = [...text].reduce((sum, ch) => sum + (ch.charCodeAt(0) < 0x80 ? 0.6 : 1), 0) * 15;
          const attrs = { x: x + 38, y: y + 20, "font-size": 15, "font-weight": 700, fill: value ? "#1f2937" : "#9ca3af" };
          if (estimated > maxWidth) {
            attrs.textLength = maxWidth;
            attrs.lengthAdjust = "spacingAndGlyphs";
          }
          g.appendChild(makeSvg("text", attrs, text));
          fo.replaceWith(g);
        });

        return new XMLSerializer().serializeToString(clone);
      }

      function loadImage(url) {
        return new Promise((resolve, reject) => {
          const img = new Image();
          img.onload = () => resolve(img);
          img.onerror = reject;
          img.src = url;
        });
      }

      async function downloadAsPng() {
        const scale = 2;
        const title = document.getElementById("imageTitle").value.trim();
        const headerHeight = title ? 70 : 0;
        const blob = new Blob([buildExportSvg()], { type: "image/svg+xml" });
        const url = URL.createObjectURL(blob);

        try {
          const img = await loadImage(url);
          const canvas = document.createElement("canvas");
          canvas.width = VIEW_WIDTH * scale;
          canvas.height = (VIEW_HEIGHT + headerHeight) * scale;
          const ctx = canvas.getContext("2d");
          ctx.scale(scale, scale);

          ctx.fillStyle = "#fffdf8";
          ctx.fillRect(0, 0, VIEW_WIDTH, VIEW_HEIGHT + headerHeight);
          if (title) {
            ctx.fillStyle = "#1d2433";
            ctx.font = "700 28px 'Noto Sans JP', sans-serif";
            ctx.textBaseline = "middle";
            ctx.fillText(title, 24, headerHeight / 2 + 4, VIEW_WIDTH - 48);
          }
          ctx.drawImage(img, 0, headerHeight, VIEW_WIDTH, VIEW_HEIGHT);

          let fileName = document.getElementById("fileName").value.trim() || "octa.png";
          if (!fileName.toLowerCase().endsWith(".png")) {
            fileName += ".png";
          }

          const link = document.createElement("a");
          link.href = canvas.toDataURL("image/png");
          link.download = fileName;
          document.body.appendChild(link);
          link.click();
          link.remove();

          statusEl.textContent = "PNGをダウンロードしました: " + fileName;
        } catch (error) {
          statusEl.textContent = "画像化に失敗しました: " + error;
        } finally {
          URL.revokeObjectURL(url);
        }
      }

      renderWireframe();
      document.getElementById("download").addEventListener("click", downloadAsPng);
    </script>
  </body>
</html>
